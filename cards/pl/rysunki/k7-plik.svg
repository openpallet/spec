<text x="214" y="241" font-size="10.5" fill="#555555" font-family="Segoe UI, Arial, Helvetica, sans-serif">ruchy warstwy, w kolejności odkładania</text>
<text x="62" y="258" font-size="9.8" fill="#555555" font-family="Consolas, 'Courier New', monospace">placing_order, x_min, x_max, y_min, y_max, x_middle, y_middle, size_x, size_y</text>
<text x="62" y="275" font-size="9.8" fill="#555555" font-family="Consolas, 'Courier New', monospace">gripper_pick_orientation, gripper_place_orientation, placing_direction,</text>
<text x="62" y="292" font-size="9.8" fill="#555555" font-family="Consolas, 'Courier New', monospace">gripper_align, gripper_open_side</text>
<rect x="58" y="298" width="22" height="14" fill="#ffffff" rx="3" stroke="#555555" stroke-width="1"/>
<text x="69" y="308.6" font-size="9.5" fill="#7b2fa0" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" font-weight="bold">[]</text>
<text x="86" y="309" font-size="11" fill="#1f1f1f" font-family="Consolas, 'Courier New', monospace" font-weight="bold">products</text>
<text x="214" y="309" font-size="10.5" fill="#555555" font-family="Segoe UI, Arial, Helvetica, sans-serif">produkty odkładane w tym ruchu: położenie na palecie</text>
<text x="86" y="326" font-size="9.8" fill="#555555" font-family="Consolas, 'Courier New', monospace">id, orientation, x, y, size_x, size_y, type → product_types.id</text>
<rect x="58" y="332" width="22" height="14" fill="#ffffff" rx="3" stroke="#555555" stroke-width="1"/>
<text x="69" y="342.6" font-size="9.5" fill="#7b2fa0" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" font-weight="bold">[]</text>
<text x="86" y="343" font-size="11" fill="#1f1f1f" font-family="Consolas, 'Courier New', monospace" font-weight="bold">products_at_pick</text>
<text x="214" y="343" font-size="10.5" fill="#555555" font-family="Segoe UI, Arial, Helvetica, sans-serif">te same produkty przy pobraniu, od końca transportera</text>
<text x="86" y="360" font-size="9.8" fill="#555555" font-family="Consolas, 'Courier New', monospace">product_id, orientation</text>
<rect x="10" y="366" width="22" height="14" fill="#ffffff" rx="3" stroke="#555555" stroke-width="1"/>
<text x="21" y="376.6" font-size="9.5" fill="#7b2fa0" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" font-weight="bold">{}</text>
<text x="38" y="377" font-size="11" fill="#1f1f1f" font-family="Consolas, 'Courier New', monospace" font-weight="bold">gripper</text>
<text x="214" y="377" font-size="10.5" fill="#555555" font-family="Segoe UI, Arial, Helvetica, sans-serif">chwytak stanowiska: obrys, dozwolone orientacje, strony otwarcia, wyrównania</text>
<rect x="10" y="383" width="22" height="14" fill="#ffffff" rx="3" stroke="#555555" stroke-width="1"/>
<text x="21" y="393.6" font-size="9.5" fill="#7b2fa0" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" font-weight="bold">{}</text>
<text x="38" y="394" font-size="11" fill="#1f1f1f" font-family="Consolas, 'Courier New', monospace" font-weight="bold">source</text>
<text x="214" y="394" font-size="10.5" fill="#555555" font-family="Segoe UI, Arial, Helvetica, sans-serif">transporter: koniec (stop: 180), dozwolone orientacje produktu</text>
<rect x="10" y="400" width="22" height="14" fill="#ffffff" rx="3" stroke="#555555" stroke-width="1"/>
<text x="21" y="410.6" font-size="9.5" fill="#7b2fa0" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" font-weight="bold">{}</text>
<text x="38" y="411" font-size="11" fill="#1f1f1f" font-family="Consolas, 'Courier New', monospace" font-weight="bold">limits</text>
<text x="214" y="411" font-size="10.5" fill="#555555" font-family="Segoe UI, Arial, Helvetica, sans-serif">limity sterownika: rozmiary tablic PLC</text>
<rect x="10" y="417" width="22" height="14" fill="#ffffff" rx="3" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="3 2"/>
<text x="21" y="427.6" font-size="9.5" fill="#9e9e9e" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" font-weight="bold">{}</text>
<text x="38" y="428" font-size="11" fill="#9e9e9e" font-family="Consolas, 'Courier New', monospace" font-weight="bold">x-palletdesigner</text>
<text x="214" y="428" font-size="10.5" fill="#9e9e9e" font-family="Segoe UI, Arial, Helvetica, sans-serif">dane PalletDesignera do ponownego otwarcia projektu w programie.</text>
<text x="38" y="445" font-size="10.5" fill="#9e9e9e" font-family="Segoe UI, Arial, Helvetica, sans-serif">Inne programy, PLC i robot mogą go pominąć.</text>
