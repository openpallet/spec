<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 464" width="680" height="464" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title>Plik OpenPallet 1.2: obiekty i listy zagnieżdżone</title>
<rect x="10" y="9" width="22" height="14" fill="#ffffff" rx="3" stroke="#555555" stroke-width="1"/>
<text x="21" y="19.6" font-size="9.5" fill="#7b2fa0" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" font-weight="bold">{}</text>
<text x="38" y="20" font-size="11" fill="#1f1f1f" font-family="Consolas, 'Courier New', monospace" font-weight="bold">format</text>
<text x="214" y="20" font-size="10.5" fill="#555555" font-family="Segoe UI, Arial, Helvetica, sans-serif">name "OpenPallet", version "1.2"</text>
<rect x="10" y="26" width="22" height="14" fill="#ffffff" rx="3" stroke="#555555" stroke-width="1"/>
<text x="21" y="36.6" font-size="9.5" fill="#7b2fa0" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" font-weight="bold">{}</text>
<text x="38" y="37" font-size="11" fill="#1f1f1f" font-family="Consolas, 'Courier New', monospace" font-weight="bold">header</text>
<text x="214" y="37" font-size="10.5" fill="#555555" font-family="Segoe UI, Arial, Helvetica, sans-serif">nazwa receptury, data zapisu, program, suma kontrolna</text>
<rect x="10" y="43" width="22" height="14" fill="#ffffff" rx="3" stroke="#555555" stroke-width="1"/>
<text x="21" y="53.6" font-size="9.5" fill="#7b2fa0" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" font-weight="bold">{}</text>
<text x="38" y="54" font-size="11" fill="#1f1f1f" font-family="Consolas, 'Courier New', monospace" font-weight="bold">pallet</text>
<text x="214" y="54" font-size="10.5" fill="#555555" font-family="Segoe UI, Arial, Helvetica, sans-serif">pusta paleta: length (X), width (Y), height, w mm</text>
<rect x="10" y="60" width="22" height="14" fill="#ffffff" rx="3" stroke="#555555" stroke-width="1"/>
<text x="21" y="70.6" font-size="9.5" fill="#7b2fa0" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" font-weight="bold">{}</text>
<text x="38" y="71" font-size="11" fill="#1f1f1f" font-family="Consolas, 'Courier New', monospace" font-weight="bold">product</text>
<text x="214" y="71" font-size="10.5" fill="#555555" font-family="Segoe UI, Arial, Helvetica, sans-serif">nazwa i kod produktu</text>
<rect x="10" y="77" width="22" height="14" fill="#ffffff" rx="3" stroke="#555555" stroke-width="1"/>
<text x="21" y="87.6" font-size="9.5" fill="#7b2fa0" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" font-weight="bold">{}</text>
<text x="38" y="88" font-size="11" fill="#1f1f1f" font-family="Consolas, 'Courier New', monospace" font-weight="bold">summary</text>
<text x="214" y="88" font-size="10.5" fill="#555555" font-family="Segoe UI, Arial, Helvetica, sans-serif">podsumowanie: liczba warstw, produktów, ruchów, przekładek, wysokość, masa</text>
<rect x="10" y="94" width="22" height="14" fill="#ffffff" rx="3" stroke="#555555" stroke-width="1"/>
<text x="21" y="104.6" font-size="9.5" fill="#7b2fa0" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" font-weight="bold">[]</text>
<text x="38" y="105" font-size="11" fill="#1f1f1f" font-family="Consolas, 'Courier New', monospace" font-weight="bold">product_types</text>
<text x="214" y="105" font-size="10.5" fill="#555555" font-family="Segoe UI, Arial, Helvetica, sans-serif">typy produktów</text>
<text x="38" y="122" font-size="9.8" fill="#555555" font-family="Consolas, 'Courier New', monospace">id, name, code, length, width, height, mass, label_sides, count</text>
