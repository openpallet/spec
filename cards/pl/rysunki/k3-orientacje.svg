<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 150" width="680" height="150" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title>Chwytak w orientacji 0, 90, 180 i 270</title>
<g transform="translate(92 62) rotate(0)" data-rotation="0">
