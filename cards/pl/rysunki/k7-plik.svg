<text x="21" y="138.6" font-size="9.5" fill="#7b2fa0" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" font-weight="bold">[]</text>
<text x="38" y="139" font-size="11" fill="#1f1f1f" font-family="Consolas, 'Courier New', monospace" font-weight="bold">slip_sheet_types</text>
<text x="214" y="139" font-size="10.5" fill="#555555" font-family="Segoe UI, Arial, Helvetica, sans-serif">typy przekładek</text>
<text x="38" y="156" font-size="9.8" fill="#555555" font-family="Consolas, 'Courier New', monospace">id, thickness</text>
<rect x="10" y="162" width="22" height="14" fill="#ffffff" rx="3" stroke="#555555" stroke-width="1"/>
<text x="21" y="172.6" font-size="9.5" fill="#7b2fa0" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" font-weight="bold">[]</text>
<text x="38" y="173" font-size="11" fill="#1f1f1f" font-family="Consolas, 'Courier New', monospace" font-weight="bold">stack</text>
<text x="214" y="173" font-size="10.5" fill="#555555" font-family="Segoe UI, Arial, Helvetica, sans-serif">stos: warstwy i przekładki od palety (0) w górę</text>
<text x="38" y="190" font-size="9.8" fill="#555555" font-family="Consolas, 'Courier New', monospace">position, layout → layouts.id, slip_sheet → slip_sheet_types.id</text>
<rect x="10" y="196" width="22" height="14" fill="#ffffff" rx="3" stroke="#555555" stroke-width="1"/>
<text x="21" y="206.6" font-size="9.5" fill="#7b2fa0" font-family="Consolas, 'Courier New', monospace" text-anchor="middle" font-weight="bold">[]</text>
<text x="38" y="207" font-size="11" fill="#1f1f1f" font-family="Consolas, 'Courier New', monospace" font-weight="bold">layouts</text>
<text x="214" y="207" font-size="10.5" fill="#555555" font-family="Segoe UI, Arial, Helvetica, sans-serif">warstwy unikalne: każdy układ warstwy zapisany raz</text>
<text x="38" y="224" font-size="9.8" fill="#555555" font-family="Consolas, 'Courier New', monospace">id</text>
<rect x="34" y="230" width="22" height="14" fill="#ffffff" rx="3" stroke="#555555" stroke-width="1"/>
