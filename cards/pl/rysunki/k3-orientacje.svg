<circle cx="0" cy="0" r="2.52" fill="#7a4a00"/>
</g>
<text x="92" y="128" font-size="12" fill="#1f1f1f" font-family="Segoe UI, Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="bold">orientacja 0</text>
